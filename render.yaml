# Blueprint do backend no Render (seção 7.4). Import: New > Blueprint > este repo.
# Os valores marcados `sync: false` são preenchidos no painel (segredos) e NÃO
# ficam no git. Troque os placeholders CORS_ORIGIN e R2_PUBLIC_BASE pelos reais.
services:
  - type: web
    name: mostruario-api
    runtime: node
    plan: starter # pago (US$7/mês): sempre no ar, SEM spin-down/cold start do free tier.
    # Precisa concluir o upgrade no painel do Render (Settings > Instance Type > Starter)
    # e ter forma de pagamento na workspace. O Neon pode seguir no free (acorda em ~ms).
    rootDir: . # raiz do repo — é workspace npm
    # --include=dev: com NODE_ENV=production o npm omite devDependencies (tsc, @types/node).
    # Sem isso o Render cai num tsc GLOBAL da imagem (versão nova) e o build quebra.
    buildCommand: npm ci --include=dev && npm run build -w backend
    # Migra o Neon (DIRECT) antes de subir — lixeira e schemas novos precisam disso.
    # Depois sobe com cwd=backend (workspace), onde `dist/backend/src/server.js` existe.
    startCommand: npm run migrate -w backend && npm run start -w backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production # ativa o obrigatoria('COOKIE_SECRET'): sem segredo, o processo não sobe (2.5.2)
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        value: https://sistema-planilha-backend.vercel.app
      - key: R2_BUCKET
        value: mostruario-midia # bucket dedicado, NUNCA o do outro projeto do dono (7.1)
      - key: R2_PUBLIC_BASE
        value: https://pub-856c1e1b6dc645308495de9e44b391e0.r2.dev # r2.dev público (trocar por domínio próprio depois, 7.2b)
      - key: LINK_PUBLICO_DIAS
        value: "30" # dias até o link /r/<token> expirar. 0 = nunca. Bruno ajusta aqui no painel do Render.
      # --- segredos: preenchidos no painel, ficam fora do git ---
      - key: DATABASE_URL # Neon POOLED (host com -pooler, ?sslmode=require) — a aplicação (7.6)
        sync: false
      - key: DATABASE_URL_DIRECT # Neon DIRECT (sem -pooler) — só as migrations (7.6)
        sync: false
      - key: COOKIE_SECRET # node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID # token R2 Object Read & Write ESCOPADO a mostruario-midia (7.1)
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
